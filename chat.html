<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="UBverse is a student-built campus companion for international students at the University at Buffalo."
  >

  <title>Region Matcher | UBverse</title>

  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="theme-color" content="#005bbb">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="topnav" aria-label="Main navigation">
    <div class="topnav-content">
      <a class="nav-left" href="index.html" style="text-decoration:none" aria-label="UBverse home">
        <img src="ub.jpg" alt="UBverse logo" class="logo">
        <span class="logo-text">UBverse</span>
      </a>
      <div class="nav-right">
        <a href="index.html">Home</a><a class="active" aria-current="page" href="chat.html">Chat</a><a href="translator.html">Translator</a><a href="map.html">Map</a><a href="region.html">Region Matcher</a><a href="mood.html">Mood Tracker</a>
      </div>
    </div>
  </nav>

  <main class="chat-page">
    <section class="app-container" aria-label="UB GlobalPal chat">
      <header class="chat-header">
        <div class="chat-header-icon" aria-hidden="true">🐂</div>
        <div>
          <h1>UB GlobalPal</h1>
          <p>Student-project AI assistant • verify official policies with UB</p>
        </div>
      </header>

      <div id="chat-box" aria-live="polite" aria-label="Conversation">
        <div class="message bot">Hey there! I’m GlobalPal 🐂💙.

I can help with everyday life at UB and around Buffalo. Ask about food, campus culture, local basics, or general student questions.</div>
      </div>

      <div class="quick-replies" aria-label="Suggested questions">
        <button class="chip" type="button" data-query="Where can I get halal food near UB?">🌯 Halal Food</button>
        <button class="chip" type="button" data-query="I feel lonely and want ideas for meeting people on campus">😔 Feeling Lonely</button>
        <button class="chip" type="button" data-query="How much should I tip in the US?">💵 Tipping Rules</button>
        <button class="chip" type="button" data-query="What is Tim Hortons and what do people usually order?">☕ Timmies?</button>
      </div>

      <form class="input-zone" id="chat-form">
        <label for="user-input" class="sr-only" style="position:absolute;left:-9999px">Message</label>
        <input type="text" id="user-input" maxlength="1200" placeholder="Ask me anything..." autocomplete="off" required>
        <button type="submit" id="send-btn" aria-label="Send message">➤</button>
      </form>
    </section>
  </main>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const form = document.getElementById('chat-form');
    let history = [];

    function appendMessage(text, sender, isLoading = false) {
      const div = document.createElement('div');
      div.className = `message ${sender}${isLoading ? ' loading-dots' : ''}`;
      div.textContent = String(text);
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    async function ask(query) {
      const message = String(query || '').trim();
      if (!message || sendBtn.disabled) return;

      appendMessage(message, 'user');
      userInput.value = '';
      sendBtn.disabled = true;
      const loadingMsg = appendMessage('Typing', 'bot', true);

      try {
          const res = await fetch('https://ubverse-api.onrender.com/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json().catch(() => ({}));
        loadingMsg.remove();

        if (!response.ok) {
          appendMessage(data.error || `Chat request failed (${response.status}).`, 'bot');
          return;
        }

        const reply = data.reply || 'Sorry, I could not generate a response.';
        appendMessage(reply, 'bot');
        history.push({ role: 'user', parts: [{ text: message }] });
        history.push({ role: 'model', parts: [{ text: reply }] });
        history = history.slice(-12);
      } catch (error) {
        loadingMsg.remove();
        appendMessage('⚠️ I could not reach the UBverse server. Make sure server.js is running.', 'bot');
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      ask(userInput.value);
    });

    document.querySelectorAll('.chip').forEach((button) => {
      button.addEventListener('click', () => ask(button.dataset.query));
    });
  </script>
</body>
</html>
