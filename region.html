<script>
  const STORAGE_KEY = 'ubverseStudents';

  const regForm = document.getElementById('regForm');
  const registerBtn = document.getElementById('registerBtn');
  const registerStatus = document.getElementById('registerStatus');

  const searchBtn = document.getElementById('searchBtn');
  const searchCountry = document.getElementById('searchCountry');
  const searchStatus = document.getElementById('searchStatus');
  const results = document.getElementById('results');

  function setStatus(element, message, type = '') {
    element.className = `status${type ? ` ${type}` : ''}`;
    element.textContent = message;
  }

  function getStudents() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveStudents(students) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
  }

  // REGISTER
  regForm.addEventListener('submit', (event) => {
    event.preventDefault();

    const name = document.getElementById('name').value.trim();
    const country = document.getElementById('country').value.trim();
    const ubit = document.getElementById('ubit').value.trim().toLowerCase();
    const phone = document.getElementById('phone').value.trim();
    const sharePhone = document.getElementById('sharePhone').checked;
    const consent = document.getElementById('consent').checked;

    if (!name || !country || !ubit) {
      setStatus(registerStatus, 'Please complete all required fields.', 'error');
      return;
    }

    if (!ubit.endsWith('@buffalo.edu')) {
      setStatus(
        registerStatus,
        'Please use a valid @buffalo.edu email address.',
        'error'
      );
      return;
    }

    if (!consent) {
      setStatus(registerStatus, 'You must agree before registering.', 'error');
      return;
    }

    const students = getStudents();

    const existingIndex = students.findIndex(
      student => student.ubit === ubit
    );

    const student = {
      name,
      country,
      ubit,
      phone,
      sharePhone
    };

    if (existingIndex >= 0) {
      students[existingIndex] = student;
    } else {
      students.push(student);
    }

    saveStudents(students);

    setStatus(
      registerStatus,
      'Registration saved successfully!',
      'success'
    );

    searchCountry.value = country;
    regForm.reset();
  });

  // SEARCH
  function searchStudents() {
    const country = searchCountry.value.trim().toLowerCase();

    results.replaceChildren();

    if (!country) {
      setStatus(searchStatus, 'Enter a country to search.', 'error');
      return;
    }

    const students = getStudents();

    const found = students.filter(
      student => student.country.toLowerCase() === country
    );

    if (found.length === 0) {
      setStatus(
        searchStatus,
        'No students found from that country yet.'
      );
      return;
    }

    setStatus(
      searchStatus,
      `${found.length} student${found.length === 1 ? '' : 's'} found.`,
      'success'
    );

    found.forEach(student => {
      const card = document.createElement('div');
      card.className = 'student';

      const name = document.createElement('strong');
      name.textContent = student.name;

      const countryLine = document.createElement('div');
      countryLine.textContent = student.country;

      const email = document.createElement('a');
      email.href = `mailto:${student.ubit}`;
      email.textContent = student.ubit;

      card.append(name, countryLine, email);

      if (student.sharePhone && student.phone) {
        const phone = document.createElement('div');
        phone.textContent = `Phone: ${student.phone}`;
        card.append(phone);
      }

      results.appendChild(card);
    });
  }

  searchBtn.addEventListener('click', searchStudents);

  searchCountry.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      searchStudents();
    }
  });
</script>
